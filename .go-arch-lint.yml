# Enforced in specialized tooling CI; custom tools/archcheck remains the
# canonical rule for cross-capability imports and future dynamic capabilities.
# Tool version: github.com/fe3dback/go-arch-lint@v1.19.2
version: 3
workdir: internal
allow:
  depOnAnyVendor: false
  deepScan: true
# This exact integration-only file wires independent adapters under a test
# fixture. The custom architecture checker and the mandatory real-DB gate
# still analyze/run it. Do not exempt any production package or directory.
excludeFiles:
  - "^.*mailgun_mock_integration_test\\.go$"
# Only the platform adapter can import the selected DB and migration libraries.
vendors:
  pgx:
    in:
      - github.com/jackc/pgx/v5
      - github.com/jackc/pgx/v5/**
  migrate:
    in:
      - github.com/golang-migrate/migrate/v4
      - github.com/golang-migrate/migrate/v4/**
  identity_argon2:
    in:
      - golang.org/x/crypto/argon2
  identity_unicode:
    in:
      - golang.org/x/text/unicode/norm
components:
  identity_facade:
    in: modules/identity
  app:
    in: app/**
  platform:
    in: platform/**
  identity_handler:
    in: modules/identity/internal/handler/**
  identity_domain:
    in: modules/identity/internal/domain/**
  identity_handler:
    in: modules/identity/internal/handler/**
  identity_usecase:
    in: modules/identity/internal/usecase/**
  identity_credential:
    in: modules/identity/internal/repository/credential/**
  identity_mailcrypto:
    in: modules/identity/internal/repository/mailcrypto/**
  identity_mailgun:
    in: modules/identity/internal/repository/mailgun/**
  identity_postgres:
    in: modules/identity/internal/repository/postgres/**
deps:
  identity_facade:
    mayDependOn:
      - identity_handler
      - identity_usecase
      - identity_mailcrypto
      - identity_mailgun
      - identity_postgres
      - platform
    canUse:
      - pgx
  app:
    mayDependOn:
      - platform
  # The current config schema requires at least one explicit reference;
  # self-component references do not grant cross-layer imports.
  platform:
    mayDependOn:
      - platform
    canUse:
      - pgx
      - migrate
  # Identity keeps domain pure, usecase port-owned and crypto in one adapter.
  # tools/archcheck additionally blocks cross-capability and forbidden imports.
  identity_handler:
    mayDependOn:
      - identity_usecase
      - identity_domain
  identity_domain:
    mayDependOn:
      - identity_domain
    canUse:
      - identity_unicode
  identity_handler:
    mayDependOn:
      - identity_usecase
  identity_usecase:
    mayDependOn:
      - identity_domain
  identity_credential:
    mayDependOn:
      - identity_domain
    canUse:
      - identity_argon2
  identity_mailcrypto:
    mayDependOn:
      - identity_usecase
  identity_mailgun:
    mayDependOn:
      - identity_usecase
  identity_postgres:
    mayDependOn:
      - identity_domain
      - identity_usecase
      - platform
    canUse:
      - pgx
