name: Identity real browser E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_DB: mamony_test_ci
          POSTGRES_USER: mamony_test_admin
          POSTGRES_PASSWORD: local-test-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mamony_test_admin -d mamony_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_ADMIN_URL: postgres://mamony_test_admin:local-test-admin@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_DATABASE_URL: postgres://mamony_test_runtime:local-test-runtime@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_PLATFORM_MIGRATION_URL: postgres://mamony_platform_migrator:local-test-platform-migrator@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_PLATFORM_RUNTIME_URL: postgres://mamony_platform_runtime:local-test-platform-runtime@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_MIGRATION_URL: postgres://mamony_identity_migrator:local-test-identity-migrator@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RUNTIME_URL: postgres://mamony_identity_runtime:local-test-identity-runtime@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_VERIFIER_URL: postgres://mamony_identity_verifier_runtime:local-test-identity-verifier@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_AUTHENTICATOR_URL: postgres://mamony_identity_authenticator_runtime:local-test-identity-authenticator@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_AUTH_GRANT_URL: postgres://mamony_identity_auth_grant_runtime:local-test-identity-auth-grant@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_NOTICE_WEBHOOK_URL: postgres://mamony_identity_recovery_notice_webhook_runtime:local-test-identity-recovery-notice-webhook@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_NOTICE_URL: postgres://mamony_identity_recovery_notice_runtime:local-test-identity-recovery-notice@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_NOTICE_MONITOR_URL: postgres://mamony_identity_recovery_notice_monitor_runtime:local-test-identity-recovery-notice-monitor@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_CODE_NOTICE_WEBHOOK_URL: postgres://mamony_identity_recovery_code_notice_webhook_runtime:local-test-identity-recovery-code-notice-webhook@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_CODE_NOTICE_URL: postgres://mamony_identity_recovery_code_notice_runtime:local-test-identity-recovery-code-notice@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_CODE_NOTICE_MONITOR_URL: postgres://mamony_identity_recovery_code_notice_monitor_runtime:local-test-identity-recovery-code-notice-monitor@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_FACTOR_ISSUER_URL: postgres://mamony_identity_recovery_factor_issuer_runtime:local-test-recovery-factor-issuer@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_FACTOR_VERIFIER_URL: postgres://mamony_identity_recovery_factor_verifier_runtime:local-test-recovery-factor-verifier@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_PASSKEY_REGISTRATION_ISSUER_URL: postgres://mamony_identity_passkey_registration_issuer_runtime:local-test-passkey-registration-issuer@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_PASSKEY_REGISTRATION_READER_URL: postgres://mamony_identity_passkey_registration_reader_runtime:local-test-passkey-registration-reader@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_CODE_MANAGER_URL: postgres://mamony_identity_recovery_code_manager_runtime:local-test-identity-recovery-code-manager@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_ASSURANCE_URL: postgres://mamony_identity_recovery_assurance_runtime:local-test-identity-recovery-assurance@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_REDEEMER_URL: postgres://mamony_identity_recovery_redeemer_runtime:local-test-identity-recovery-redeemer@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_DELIVERY_URL: postgres://mamony_identity_recovery_delivery_runtime:local-test-identity-recovery-delivery@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_RECOVERY_ISSUER_URL: postgres://mamony_identity_recovery_issuer_runtime:local-test-identity-recovery-issuer@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_PASSWORD_CHANGE_URL: postgres://mamony_identity_password_change_runtime:local-test-identity-password-change@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_SESSION_URL: postgres://mamony_identity_session_runtime:local-test-identity-session@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_NOTICE_MONITOR_URL: postgres://mamony_identity_notice_monitor_runtime:local-test-identity-notice-monitor@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_NOTICE_WEBHOOK_URL: postgres://mamony_identity_notice_webhook_runtime:local-test-identity-notice-webhook@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_SECURITY_NOTICE_URL: postgres://mamony_identity_security_notice_runtime:local-test-identity-security-notice@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_DELIVERY_URL: postgres://mamony_identity_delivery_runtime:local-test-identity-delivery@127.0.0.1:5432/mamony_test_ci?sslmode=disable
      TEST_IDENTITY_MAINTENANCE_URL: postgres://mamony_identity_maintenance_runtime:local-test-identity-maintenance@127.0.0.1:5432/mamony_test_ci?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Setup pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Provision PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Install pinned Playwright package
        run: |
          npm install --prefix tools/browsercheck --ignore-scripts --no-audit --no-fund --no-package-lock
          node -e "if(require('./tools/browsercheck/node_modules/playwright/package.json').version !== '1.65.1') process.exit(1)"
      - name: Install isolated Chromium headless browser
        run: tools/browsercheck/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Bootstrap disposable roles and run all required database gates
        run: make integration
      - name: Run actual Chromium for verification, sessions, and password change
        run: |
          go test -tags=integration,browser_e2e -run '^TestIdentityZBrowser(Verification|Session|PasswordChange)E2E$' \
            -count=1 -timeout=6m ./internal/modules/identity
