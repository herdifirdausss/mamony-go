name: Temporary browser session gofmt audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  gofmt-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/identity-first-party-session-http-candidate'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Print gofmt source for review without changing branch
        run: |
          for path in internal/modules/identity/internal/handler/browser_session_http.go internal/modules/identity/internal/handler/browser_session_csrf.go internal/modules/identity/internal/handler/browser_session_http_test.go internal/platform/httpedge/routes_test.go; do
            gofmt -w "$path"
            echo "FMT_START:$path"
            base64 -w 256 "$path"
            echo "FMT_END:$path"
          done
