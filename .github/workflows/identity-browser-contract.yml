name: Identity browser contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Pin Node.js for dependency-free browser contract simulation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Exercise the exact embedded browser JavaScript
        run: node --test tools/browsercheck/email_verification_page.test.cjs
