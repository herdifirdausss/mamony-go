name: Specialized Go tools
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Install pinned Go CLI tools
        run: |
          go install github.com/fe3dback/go-arch-lint@v1.19.2
          go install gotest.tools/gotestsum@v1.13.0
      - name: Enforce package dependency architecture
        run: "$(go env GOPATH)/bin/go-arch-lint check --project-path ."
      - name: Test with machine-readable evidence
        run: |
          mkdir -p .artifacts
          "$(go env GOPATH)/bin/gotestsum" \
            --format pkgname \
            --junitfile .artifacts/unit.xml \
            --jsonfile .artifacts/unit.json \
            -- ./...
      - name: Upload full test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: specialized-go-tool-reports
          path: .artifacts/
          if-no-files-found: warn
          retention-days: 7
