# Temporary exact-go-toolchain lockfile generator for the isolated
# maintained WebAuthn dependency. Deleted from this branch after extracting
# the canonical go.mod/go.sum files; never ships with the final PR.
name: Temporary WebAuthn dependency lockfiles

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Go from pinned repository toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Canonical module graph and checksums
        run: |
          go mod tidy
          echo '__MAMONY_GO_MOD_BEGIN__'
          cat go.mod
          echo '__MAMONY_GO_MOD_END__'
          echo '__MAMONY_GO_SUM_BEGIN__'
          cat go.sum
          echo '__MAMONY_GO_SUM_END__'
